<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS Dashboard — TrailWatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cms.css?v=hk20261112b" />
</head>
<body class="cms-body">
  <div id="cmsShell">
    <h1>Dashboard</h1>
    <p class="sub">Queues that need staff action. Open a card to work the list.</p>
    <div class="cms-stats" id="stats"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="js/cms-ui.js"></script>
  <script>
    cmsInitShell("dash");
    const s = CMS.getStore();
    const pending = (s.incidents || []).filter((i) => i.status === "received" || i.status === "under_review").length;
    const memPending = (s.members || []).filter((m) => m.status === "pending").length;
    const ntfSched = (s.notifications || []).filter((n) => n.status === "scheduled").length;
    const unpublished = (s.banners || []).filter((b) => b.published === false).length;
    const fbNew = (s.feedback || []).filter((f) => f.status === "new").length;
    document.getElementById("stats").innerHTML = `
      <a class="cms-stat" href="incidents.html"><div class="v">${pending}</div><div class="l">Incidents pending</div></a>
      <a class="cms-stat" href="members.html"><div class="v">${memPending}</div><div class="l">Members pending</div></a>
      <a class="cms-stat" href="notifications.html"><div class="v">${ntfSched}</div><div class="l">Scheduled notifications</div></a>
      <a class="cms-stat" href="banners.html"><div class="v">${unpublished}</div><div class="l">Unpublished banners</div></a>
      <a class="cms-stat" href="feedback.html"><div class="v">${fbNew}</div><div class="l">New feedback</div></a>
    `;
  </script>
</body>
</html>
